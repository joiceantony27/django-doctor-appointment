<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Django Doctor Appointment System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div class="container-fluid">
        <div class="row min-vh-100">
            <div class="col-12 d-flex align-items-center justify-content-center bg-light">
                <div class="text-center">
                    <div class="mb-4">
                        <i class="fas fa-user-md text-primary" style="font-size: 4rem;"></i>
                    </div>
                    <h1 class="display-4 text-primary mb-3">Django Doctor Appointment System</h1>
                    <p class="lead text-muted mb-4">Your Healthcare Management Platform</p>
                    
                    <div class="row justify-content-center">
                        <div class="col-md-8">
                            <div class="card shadow-sm">
                                <div class="card-body p-4">
                                    <h5 class="card-title text-success mb-3">
                                        <i class="fas fa-check-circle me-2"></i>
                                        Deployment Successful!
                                    </h5>
                                    <p class="card-text">
                                        Your Django Doctor Appointment System is now running successfully on Azure.
                                    </p>
                                    
                                    <div class="row mt-4">
                                        <div class="col-md-6 mb-3">
                                            <div class="d-grid">
                                                <a href="/admin/" class="btn btn-primary">
                                                    <i class="fas fa-cog me-2"></i>Admin Panel
                                                </a>
                                            </div>
                                        </div>
                                        <div class="col-md-6 mb-3">
                                            <div class="d-grid">
                                                <a href="/login/" class="btn btn-outline-primary">
                                                    <i class="fas fa-sign-in-alt me-2"></i>Login
                                                </a>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                    
                    <div class="mt-4">
                        <small class="text-muted">
                            <i class="fas fa-server me-1"></i>
                            Running on Azure Web App | 
                            <i class="fas fa-database me-1"></i>
                            SQLite Database
                        </small>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
